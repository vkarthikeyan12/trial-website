<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ profile.name }} — {{ profile.title }}{% endblock %}</title>
  <meta name="description" content="{{ profile.bio }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230a0d0b%22/><text x=%228%22 y=%2211.5%22 font-family=%22monospace%22 font-size=%229%22 fill=%22%234dffa8%22 text-anchor=%22middle%22>&gt;_</text></svg>">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="page">
    <nav class="nav">
      <div class="wrap">
        <a href="#top" class="nav-brand mono" data-glitch="~/{{ profile.handle }}">~/{{ profile.handle }}<span class="cursor"></span></a>
        <ul class="nav-links">
          <li><a href="#about">about</a></li>
          <li><a href="#skills">skills</a></li>
          <li><a href="#projects">projects</a></li>
          <li><a href="#contact">contact</a></li>
        </ul>
      </div>
    </nav>

    <main id="top">
      {% block content %}{% endblock %}
    </main>

    <footer>
      <div class="wrap">
        &copy; {{ profile.name }} · built with Flask · <a href="{{ profile.links.github }}">source</a>
      </div>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="{{ url_for('static', filename='js/background.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
